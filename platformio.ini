; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = ststm32
framework = arduino
board = giga_r1_m7
upload_protocol = custom
extra_scripts = dfu_upload.py
build_unflags = 
	-std=c++11
	-std=gnu++11
build_flags = 
	-O2
	-std=c++17
	-std=gnu++17
	-I src/include
debug_build_flags = 
	-O0 -g
lib_deps = 
	kkloesener/MFRC522_I2C@^1.0
	pololu/Motoron@^1.5.0
	martinsos/HCSR04@^2.0.0
	sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library@^1.3.2
	arduino-libraries/ArduinoMqttClient@^0.1.8
	alexandros-charitonidis/MiniMessenger@^1.0.0
	arduino-libraries/Servo@^1.2.2

[env:release]
build_src_filter = 
	+<**>
	-<utils/*.cpp>
build_flags = 
	-O2
	-std=c++17
	-std=gnu++17
	-I src/include
	-Wno-implicit-fallthrough
	-Wno-vla
	-Wno-sign-compare
build_src_flags = 
	-Wimplicit-fallthrough
	-Wvla
	-Wsign-compare

[env:mini_demo]
build_src_filter =
	-<**>
	+<utils/minimessenger_demo.cpp>
build_flags =
	-O2
	-std=c++17
	-std=gnu++17
	-I src/include
	-Wno-implicit-fallthrough
	-Wno-vla
	-Wno-sign-compare
build_src_flags =
	-Wimplicit-fallthrough
	-Wvla
	-Wsign-compare

[platformio]
include_dir = include
src_dir = src
lib_dir = libraries
